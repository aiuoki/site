<div class="wrap">
  <div class="top">
    <header>
      <span class="eyebrow" id="hdEye"></span>
      <h1 id="hdTitle"></h1>
      <p id="hdIntro"></p>
    </header>
    <div class="tools">
      <a class="coffee-btn compact" href="https://buymeacoffee.com/danielceban" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h13v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V9z"/><path d="M17 11h1.5a2.5 2.5 0 0 1 0 5H17"/><path d="M8 3.5c0 1 1 1.5 1 2.5M12 3.5c0 1 1 1.5 1 2.5"/></svg><span data-t="ui.donate"></span></a>
      <div class="langwrap">
        <button type="button" class="lang-btn" id="langBtn" aria-haspopup="true" aria-expanded="false"></button>
        <div class="lang-menu" id="langMenu" role="menu" hidden></div>
      </div>
      <button type="button" class="theme-btn" id="themeBtn"></button>
    </div>
  </div>

  <div class="navs">
    <nav class="subjects" id="subjects">
      <button type="button" data-subj="calc" aria-pressed="true"><span class="si mr">∫</span><span data-n="calc"></span></button>
      <button type="button" data-subj="stat" aria-pressed="false"><span class="si mr">σ</span><span data-n="stat"></span></button>
      <button type="button" data-subj="lin" aria-pressed="false"><span class="si mr">[A]</span><span data-n="lin"></span></button>
    </nav>
    <nav class="tabs" role="tablist" id="calcTabs">
      <button type="button" role="tab" id="tab-uno" aria-selected="true" aria-controls="view-uno" data-t="ui.tab1"></button>
      <button type="button" role="tab" id="tab-suma" aria-selected="false" aria-controls="view-suma"><span data-t="ui.tab2"></span> <span class="mr">α ± β</span></button>
      <button type="button" role="tab" id="tab-cx" aria-selected="false" aria-controls="view-cx"><span data-n="cx"></span> <span class="mr">ℂ</span></button>
    </nav>
  </div>

  <!-- ======================= VISTA 1 ======================= -->
  <div class="view" id="view-uno" role="tabpanel" aria-labelledby="tab-uno">
    <section class="app">
      <div class="stage">
        <div class="canvas">
          <svg class="plot" id="plot" viewBox="0 0 700 700">
            <defs><clipPath id="clip"><rect x="0" y="0" width="700" height="700"/></clipPath></defs>
            <g id="static"></g>
            <g id="dyn" clip-path="url(#clip)"></g>
            <g id="labels"></g>
            <g id="handleG" tabindex="0" role="slider" aria-valuemin="0" aria-valuemax="360" style="cursor:grab;outline:none"></g>
          </svg>
        </div>
        <div class="chips" id="chips"></div>
      </div>

      <div class="panel">
        <div class="card">
          <div class="readout">
            <span class="eyebrow" data-t="ui.angle"></span>
            <div class="big" id="bigAngle"></div>
            <div class="sub" id="subAngle"></div>
            <div><span class="quad" id="quadTag"></span></div>
          </div>
          <div class="controls">
            <div class="row">
              <div class="seg" role="group">
                <button type="button" id="uDeg" aria-pressed="true" data-t="ui.deg"></button>
                <button type="button" id="uRad" aria-pressed="false" data-t="ui.radians"></button>
              </div>
              <div class="field" id="fieldWrap">
                <label for="angleIn">θ =</label>
                <input id="angleIn" inputmode="decimal" autocomplete="off" spellcheck="false" value="60">
                <span class="unit" id="unitTag">°</span>
              </div>
            </div>
            <input type="range" id="slider" min="0" max="360" step="0.1" value="60">
            <div class="hint" id="hint"></div>
            <div class="quick" id="quick"></div>
          </div>
        </div>
        <div class="card">
          <span class="eyebrow" data-t="ui.values"></span>
          <div class="vals" id="vals"></div>
        </div>
      </div>
    </section>
    <main class="guide" id="guide1"></main>
  </div>

  <!-- ======================= VISTA 2 ======================= -->
  <div class="view" id="view-suma" role="tabpanel" aria-labelledby="tab-suma" hidden>
    <section class="app">
      <div class="stage">
        <div class="canvas">
          <svg class="plot" id="plot2" viewBox="0 0 700 700">
            <defs>
              <clipPath id="clip2"><rect x="0" y="0" width="700" height="700"/></clipPath>
              <marker id="arrB" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--c-b)"/></marker>
            </defs>
            <g id="static2"></g>
            <g id="dyn2" clip-path="url(#clip2)"></g>
            <g id="labels2"></g>
            <g id="hA" tabindex="0" role="slider" aria-label="α" style="cursor:grab;outline:none"></g>
            <g id="hB" tabindex="0" role="slider" aria-label="β" style="cursor:grab;outline:none"></g>
          </svg>
        </div>
        <div class="legend" id="legend2"></div>
        <div class="chips" id="chips2"></div>
      </div>

      <div class="panel">
        <div class="card">
          <div class="controls first">
            <div class="row">
              <div class="seg" role="group">
                <button type="button" id="u2Deg" aria-pressed="true" data-t="ui.deg"></button>
                <button type="button" id="u2Rad" aria-pressed="false" data-t="ui.radians"></button>
              </div>
              <div class="seg" role="group">
                <button type="button" class="mr" id="opPlus" aria-pressed="true">α + β</button>
                <button type="button" class="mr" id="opMinus" aria-pressed="false">α − β</button>
              </div>
            </div>
            <div class="angle-block">
              <div class="field" id="fieldA" style="--lc:var(--c-a)">
                <label for="inA">α =</label>
                <input id="inA" inputmode="decimal" autocomplete="off" spellcheck="false" value="45">
                <span class="unit u2">°</span>
              </div>
              <input type="range" id="slA" min="0" max="360" step="0.1" value="45" aria-label="α" style="--rc:var(--c-a)">
            </div>
            <div class="angle-block">
              <div class="field" id="fieldB" style="--lc:var(--c-b)">
                <label for="inB">β =</label>
                <input id="inB" inputmode="decimal" autocomplete="off" spellcheck="false" value="30">
                <span class="unit u2">°</span>
              </div>
              <input type="range" id="slB" min="0" max="360" step="0.1" value="30" aria-label="β" style="--rc:var(--c-b)">
            </div>
            <div class="hint" id="hint2"></div>
            <div class="quick" id="quick2"></div>
          </div>
        </div>
        <div class="card">
          <div class="readout">
            <span class="eyebrow" data-t="ui.result"></span>
            <div class="big" id="bigG"></div>
            <div class="sub" id="subG"></div>
          </div>
          <div class="miniwrap"><table class="mini" id="mini"></table></div>
        </div>
        <div class="card">
          <span class="eyebrow" data-t="ui.withFormulas"></span>
          <div id="fx"></div>
        </div>
      </div>
    </section>
    <main class="guide" id="guide2"></main>
  </div>

  <!-- ======================= VISTA 3 · COMPLEJOS ======================= -->
  <div class="view" id="view-cx" role="tabpanel" aria-labelledby="tab-cx" hidden>
    <p class="note" id="cxOnly" hidden></p>
    <section class="app">
      <div class="stage">
        <div class="canvas">
          <svg class="plot" id="plot3" viewBox="0 0 700 700">
            <defs><clipPath id="clip3"><rect x="0" y="0" width="700" height="700"/></clipPath></defs>
            <g id="static3"></g>
            <g id="dyn3" clip-path="url(#clip3)"></g>
            <g id="hW" tabindex="0" role="slider" aria-label="w" style="cursor:grab;outline:none"></g>
            <g id="hZ" tabindex="0" role="slider" aria-label="z" style="cursor:grab;outline:none"></g>
          </svg>
        </div>
        <div class="legend" id="legend3"></div>
        <div class="chips" id="chips3"></div>
      </div>

      <div class="panel">
        <div class="card">
          <div class="readout">
            <span class="eyebrow" id="cxEye"></span>
            <div class="big" id="bigZ"></div>
            <div class="sub" id="subZ"></div>
          </div>
          <div class="controls">
            <div class="row">
              <div class="seg" role="group">
                <button type="button" id="mBin" aria-pressed="true"></button>
                <button type="button" id="mPol" aria-pressed="false"></button>
              </div>
              <div class="seg" role="group">
                <button type="button" id="cDeg" aria-pressed="false"></button>
                <button type="button" id="cRad" aria-pressed="true"></button>
              </div>
            </div>
            <div class="zrow" id="zRow">
              <span class="zlab" style="--lc:var(--c-z)"><i>z</i></span>
              <div class="field" id="fZ1" style="--lc:var(--c-z)"><label for="zA" id="lZ1"></label><input id="zA" inputmode="decimal" autocomplete="off" spellcheck="false"><span class="unit" id="uZ1"></span></div>
              <div class="field" id="fZ2" style="--lc:var(--c-z)"><label for="zB" id="lZ2"></label><input id="zB" inputmode="decimal" autocomplete="off" spellcheck="false"><span class="unit" id="uZ2"></span></div>
            </div>
            <div class="zrow" id="wRow">
              <span class="zlab" style="--lc:var(--c-w)"><i>w</i></span>
              <div class="field" id="fW1" style="--lc:var(--c-w)"><label for="wA" id="lW1"></label><input id="wA" inputmode="decimal" autocomplete="off" spellcheck="false"><span class="unit" id="uW1"></span></div>
              <div class="field" id="fW2" style="--lc:var(--c-w)"><label for="wB" id="lW2"></label><input id="wB" inputmode="decimal" autocomplete="off" spellcheck="false"><span class="unit" id="uW2"></span></div>
            </div>
            <div class="hint" id="cxHint"></div>
            <div class="angle-block">
              <span class="eyebrow" id="cxOpT"></span>
              <div class="opgrid" id="ops"></div>
              <div class="row" id="nRow"><span class="hint mr"><i>n</i> =</span><div class="seg" role="group" id="nSeg"></div></div>
            </div>
            <div class="angle-block">
              <span class="eyebrow" id="cxQuickT"></span>
              <div class="quick" id="quick3"></div>
            </div>
          </div>
        </div>
        <div class="card">
          <span class="eyebrow" id="cxResT"></span>
          <div id="cxRes"></div>
        </div>
        <div class="card">
          <span class="eyebrow" id="cxFormsT"></span>
          <div class="vals" id="cxForms"></div>
        </div>
      </div>
    </section>
    <main class="guide" id="guide3"></main>
  </div>

  <!-- ======================= PRÓXIMAMENTE ======================= -->
  <div class="view" id="view-soon" hidden>
    <section class="soon">
      <div class="soon-ic mr" id="soonIc"></div>
      <h2 id="soonT"></h2>
      <p id="soonP"></p>
      <button type="button" class="linkbtn" id="soonBack"></button>
    </section>
  </div>

  <section class="support">
    <div class="support-txt"><b data-t="ui.supportT"></b><p data-t="ui.supportP"></p></div>
    <a class="coffee-btn" href="https://buymeacoffee.com/danielceban" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h13v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V9z"/><path d="M17 11h1.5a2.5 2.5 0 0 1 0 5H17"/><path d="M8 3.5c0 1 1 1.5 1 2.5M12 3.5c0 1 1 1.5 1 2.5"/></svg><span data-t="ui.donate"></span></a>
  </section>

  <footer class="foot">
    <a class="f-mail" href="mailto:hello@danielceban.com">hello@danielceban.com</a>
    <a class="f-web" href="https://danielceban.com" target="_blank" rel="noopener">danielceban.com</a>
    <span class="f-copy">© 2026 Daniel Ceban</span>
  </footer>
</div>

<dialog id="demo" aria-labelledby="demoTitle"><div class="dlg" id="demoBody"></div></dialog>
