<title>Apuntes de Matemáticas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400;1,600&family=Young+Serif&display=swap">
<style>[hidden]{display:none!important}

/* Layout: pizarra oscura con pestañas — lienzo del círculo a la izquierda (fijo al hacer scroll), panel a la derecha, guía debajo */
:root{
  --bg:#0b0e13; --surface:#12161e; --surface-2:#181d27; --line:#252c39; --fg:#e9edf4; --muted:#8a94a8;
  --axis:#c9d0dc; --grid:#1b212c; --handle:#ffffff;
  --c-cos:#a07bff; --c-sin:#ff9d2e; --c-tan:#ffd84a; --c-cot:#2fb3e3; --c-sec:#ff4d79; --c-csc:#a6d63a;
  --c-a:#ff8a3d; --c-b:#3fd0c0; --c-g:#ff5cb0;
  --f-display:"Young Serif", Georgia, "Times New Roman", serif;
  --f-body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --f-math:"STIX Two Text", "Cambria Math", "Times New Roman", serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#eef5f1; --surface:#ffffff; --surface-2:#e5efe9; --line:#d1dcd6; --fg:#13201b; --muted:#53625b;
  --axis:#26332d; --grid:#dfe8e3; --handle:#13201b;
  --c-cos:#6c3ef0; --c-sin:#d97000; --c-tan:#b58c00; --c-cot:#0a85b8; --c-sec:#dc1f55; --c-csc:#4f8f00;
  --c-a:#d4600f; --c-b:#0b8f82; --c-g:#c81d7a;
  color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#eef5f1; --surface:#ffffff; --surface-2:#e5efe9; --line:#d1dcd6; --fg:#13201b; --muted:#53625b;
  --axis:#26332d; --grid:#dfe8e3; --handle:#13201b;
  --c-cos:#6c3ef0; --c-sin:#d97000; --c-tan:#b58c00; --c-cot:#0a85b8; --c-sec:#dc1f55; --c-csc:#4f8f00;
  --c-a:#d4600f; --c-b:#0b8f82; --c-g:#c81d7a;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.55;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:28px 22px}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:32px;min-height:calc(100vh - 50px);min-height:calc(100dvh - 50px)}
.wrap > .support{margin-top:auto}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0}
h1{font-size:clamp(30px,4.6vw,48px);line-height:1.05}
h2{font-size:clamp(22px,2.6vw,28px);line-height:1.15}
h3{font-size:18px}
p{margin:0}
.m{font-family:var(--f-math);font-style:italic;font-size:1.08em}
.mr{font-family:var(--f-math);font-size:1.08em}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
header{display:flex;flex-direction:column;gap:10px;max-width:70ch}
header p{color:var(--muted)}

/* ---------- Pestañas ---------- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.tabs::-webkit-scrollbar,.subjects::-webkit-scrollbar{display:none}
.tabs button{font:inherit;font-weight:600;font-size:15px;background:none;border:0;color:var(--muted);padding:10px 16px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button .mr{font-weight:400}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--fg)}
.view{display:flex;flex-direction:column;gap:44px}

/* ---------- App ---------- */
.app{display:grid;grid-template-columns:1fr;gap:24px;align-items:start}
@media (min-width:980px){ .app{grid-template-columns:minmax(0,1.15fr) minmax(340px,1fr)} .stage{position:sticky;top:16px} }
.stage{display:flex;flex-direction:column;gap:12px;min-width:0}
.canvas{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
svg.plot{display:block;width:100%;height:auto;max-width:100%;aspect-ratio:1;touch-action:none;cursor:crosshair;user-select:none;-webkit-user-select:none}
svg text{font-family:var(--f-math)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);cursor:pointer;font-size:14px;user-select:none}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip .sw{width:14px;height:4px;border-radius:2px;background:var(--sw,var(--muted))}
.chip:has(input:not(:checked)){opacity:.45}
.chip:has(input:not(:checked)) .sw{background:transparent;outline:1px dashed var(--muted)}
.chip:has(input:focus-visible){outline:2px solid var(--fg);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend i{width:14px;height:4px;border-radius:2px;background:var(--sw)}

.panel{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.readout{display:flex;flex-direction:column;gap:4px}
.readout .big{font-family:var(--f-math);font-size:clamp(32px,4vw,42px);line-height:1.1}
.readout .big i{color:var(--muted)}
.readout .sub{color:var(--muted);font-size:15px}
.quad{display:inline-block;margin-top:6px;font-size:13px;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--fg);border:1px solid var(--line)}

.controls{display:flex;flex-direction:column;gap:12px}
.card .controls{margin-top:16px}
.card .controls.first{margin-top:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface-2)}
.seg button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:14px;padding:8px 14px;cursor:pointer}
.seg button.mr{font-size:16px}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);font-weight:600}
.field{flex:1;min-width:0;display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.field label{padding-left:12px;font-family:var(--f-math);font-style:italic;font-size:18px;color:var(--lc,var(--muted));white-space:nowrap}
.field input{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font-family:var(--f-mono);font-size:17px;padding:9px 10px;outline:none}
.field .unit{padding-right:12px;color:var(--muted);font-family:var(--f-mono)}
.field:focus-within{border-color:var(--fg)}
.field.bad{border-color:var(--c-sec)}
.hint{font-size:13px;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--rc,var(--fg))}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.quick button{font-family:var(--f-math);font-size:15px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);border-radius:8px;padding:4px 10px;cursor:pointer}
.quick button:hover{border-color:var(--muted)}
button:focus-visible,input:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.angle-block{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--line)}

.vals{display:flex;flex-direction:column}
.val{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:4px 14px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.val:last-child{border-bottom:0}
.val .bar{grid-row:1 / span 2;align-self:stretch;border-radius:2px;background:var(--col)}
.val .name{font-family:var(--f-math);font-size:20px}
.val .def{font-size:13px;color:var(--muted);grid-column:2}
.val .exact{font-family:var(--f-math);font-size:21px;text-align:right;grid-row:1;grid-column:3;color:var(--col)}
.val .dec{grid-column:3;text-align:right;font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.val.undef .exact{color:var(--muted);font-style:italic;font-size:16px}
.val.hl{background:linear-gradient(90deg,color-mix(in srgb,var(--col) 10%,transparent),transparent)}

/* mini tabla α β γ */
.mini{width:100%;border-collapse:collapse;font-family:var(--f-math);font-size:17px;margin-top:14px}
.mini th,.mini td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.mini th{font-weight:400;font-style:italic;font-size:17px}
.mini th:first-child,.mini td:first-child{text-align:left;color:var(--muted)}
.mini tr:last-child td{border-bottom:0}
.mini .ca{color:var(--c-a)} .mini .cb{color:var(--c-b)} .mini .cg{color:var(--c-g)}
.mini td.nd{color:var(--muted);font-style:italic;font-size:14px}
.miniwrap{overflow-x:auto}

/* fórmulas en vivo */
.fx{display:flex;flex-direction:column;gap:6px;padding:14px 0;border-bottom:1px solid var(--line)}
.fx:last-child{border-bottom:0;padding-bottom:0}
.fx .f{font-family:var(--f-math);font-size:19px;line-height:1.35}
.fx .s{font-family:var(--f-math);font-size:16px;color:var(--muted);overflow-x:auto;white-space:nowrap}
.fx .r{font-family:var(--f-math);font-size:18px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.fx .ok{font-family:var(--f-body);font-size:12px;color:var(--c-csc);border:1px solid currentColor;border-radius:999px;padding:1px 8px}
.ia{color:var(--c-a)} .ib{color:var(--c-b)} .ig{color:var(--c-g)}

/* ---------- Guía ---------- */
.guide{display:flex;flex-direction:column;gap:44px}
.sec{display:flex;flex-direction:column;gap:16px}
.sec > p{max-width:68ch}
.sec > p.lead{color:var(--muted)}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.ratio{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;border-top:3px solid var(--col)}
.ratio h3{display:flex;align-items:baseline;gap:8px}
.ratio h3 .mr{color:var(--col);font-size:20px}
.ratio .f{font-family:var(--f-math);font-size:19px}
.ratio p{font-size:15px;color:var(--muted)}
.ratio p b{color:var(--fg);font-weight:600}
.defs{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.def-item{border-left:2px solid var(--line);padding:2px 0 2px 14px;font-size:15px}
.def-item b{display:block;font-family:var(--f-display);font-weight:400;font-size:17px}
.ids{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.id{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.id .f{font-family:var(--f-math);font-size:20px;line-height:1.35}
.id .live{font-family:var(--f-mono);font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.id p{font-size:14px;color:var(--muted)}
.id h3{font-size:16px}
.quads{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:520px}
.qd{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface);display:flex;flex-direction:column;gap:2px;transition:border-color .2s, background .2s}
.qd b{font-family:var(--f-display);font-weight:400}
.qd span{font-size:14px;color:var(--muted)}
.qd.on{border-color:var(--fg);background:var(--surface-2)}
.qd.on span{color:var(--fg)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table.big{border-collapse:collapse;width:100%;min-width:640px;font-family:var(--f-math);font-size:17px}
table.big th,table.big td{padding:10px 14px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
table.big th{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
table.big th[data-c]{color:var(--col)}
table.big tbody tr{cursor:pointer}
table.big tbody tr:hover{background:var(--surface-2)}
table.big tbody tr.on{background:var(--surface-2);box-shadow:inset 3px 0 0 var(--fg)}
table.big tbody tr:last-child td{border-bottom:0}
td.nd{color:var(--muted);font-style:italic;font-size:15px}
.uses{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.use{padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:15px;display:flex;flex-direction:column;gap:4px}
.use b{font-family:var(--f-display);font-weight:400;font-size:17px}
.use span{color:var(--muted)}
.steps{display:flex;flex-direction:column;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 18px;max-width:760px}
.step{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:baseline}
.step:last-child{border-bottom:0}
.step .n{font-family:var(--f-mono);color:var(--muted);font-size:13px}
.step .t{font-size:15px;color:var(--muted)}
.step .t .mr{color:var(--fg);font-size:18px;display:block;margin-top:2px;overflow-x:auto;white-space:nowrap}
.warn{border:1px solid var(--line);border-left:3px solid var(--c-sec);border-radius:12px;background:var(--surface);padding:14px 18px;display:flex;flex-direction:column;gap:6px;max-width:760px}
.warn .live{font-family:var(--f-math);font-size:17px}
/* ---------- Tarjetas con demostración ---------- */
.demo{cursor:pointer;transition:border-color .15s, background .15s}
.demo:hover{border-color:var(--muted)}
.demo:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.more{display:inline-flex;align-items:center;gap:6px;font:600 13px/1.2 var(--f-body);color:var(--fg);background:none;border:0;padding:0;margin-top:auto;padding-top:4px;cursor:pointer;width:fit-content}
.more::after{content:"→";transition:transform .15s}
.demo:hover .more::after,.more:hover::after{transform:translateX(3px)}
.ids .id .more,.ratio .more{margin-top:auto}
h3.grp{font-size:18px;color:var(--muted);margin-top:4px}
.linkbtn{font:600 14px var(--f-body);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;width:fit-content}
.linkbtn:hover{border-color:var(--muted)}

/* ---------- Cabecera y tema ---------- */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.theme-btn{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--fg);display:grid;place-items:center;cursor:pointer;transition:border-color .15s, transform .3s}
.theme-btn:hover{border-color:var(--muted)}
.theme-btn:active{transform:rotate(25deg)}
.theme-btn svg{width:20px;height:20px}

/* ---------- Popup de demostración ---------- */
dialog#demo{width:min(720px, calc(100% - 24px));max-height:calc(100% - 32px);padding:0;border:1px solid var(--line);border-radius:18px;background:var(--surface);color:var(--fg);overflow:auto;box-shadow:0 24px 70px rgba(0,0,0,.35)}
dialog#demo::backdrop{background:rgba(5,10,8,.6);backdrop-filter:blur(3px)}
dialog#demo[open]{animation:pop .22s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.dlg{display:flex;flex-direction:column;gap:20px;padding:22px clamp(16px,4vw,30px) 28px}
.dlg-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.dlg-head h2{margin-top:4px}
.dlg .x{flex:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);font-size:22px;line-height:1;cursor:pointer}
.stmt{font-family:var(--f-math);font-size:clamp(20px,3.4vw,26px);text-align:center;padding:16px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);overflow-x:auto;white-space:nowrap}
.mfig{display:block;width:100%;max-width:440px;height:auto;margin:0 auto}
.mfig.wide{max-width:600px}
.mfig text{font-family:var(--f-math)}
ol.psteps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;counter-reset:st}
ol.psteps li{counter-increment:st;display:grid;grid-template-columns:32px minmax(0,1fr);gap:4px 14px;padding:14px 0;border-bottom:1px solid var(--line)}
ol.psteps li:last-child{border-bottom:0}
ol.psteps li::before{content:counter(st);grid-row:1 / span 2;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;font:500 13px var(--f-mono);color:var(--muted);margin-top:4px}
.sf{font-family:var(--f-math);font-size:clamp(18px,2.8vw,21px);overflow-x:auto;white-space:nowrap;padding-block:4px;line-height:1.5}
ol.psteps p{font-size:15px;color:var(--muted);max-width:62ch}
.k{color:var(--c-g)}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .18em;line-height:1.2}
.fr > span:first-child{border-bottom:1.5px solid currentColor;padding:0 .25em .1em}
.fr > span:last-child{padding:.1em .25em 0}
.usebox{border-left:3px solid var(--c-csc);background:var(--surface-2);border-radius:0 12px 12px 0;padding:12px 16px;display:flex;flex-direction:column;gap:2px}
.usebox b{font-family:var(--f-display);font-weight:400;font-size:17px}
.usebox p{font-size:15px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }

/* ---------- Idioma ---------- */
.tools{display:flex;gap:8px;flex:none;align-items:center}
.langwrap{position:relative}
.lang-btn{height:44px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);display:inline-flex;align-items:center;gap:8px;padding:0 14px 0 12px;cursor:pointer;font:600 13px var(--f-mono);letter-spacing:.04em}
.lang-btn:hover{border-color:var(--muted)}
.lang-btn .chev{width:10px;height:10px;opacity:.7}
.flag{display:inline-block;width:22px;height:15px;border-radius:3px;overflow:hidden;box-shadow:0 0 0 1px color-mix(in srgb,var(--fg) 18%,transparent);flex:none}
.flag svg{display:block;width:100%;height:100%}
.lang-menu{position:absolute;right:0;top:calc(100% + 8px);z-index:30;list-style:none;margin:0;padding:6px;min-width:190px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.28);display:flex;flex-direction:column}
.lang-menu button{width:100%;display:flex;align-items:center;gap:10px;padding:9px 10px;border:0;border-radius:9px;background:none;color:var(--fg);font:15px var(--f-body);cursor:pointer;text-align:left}
.lang-menu button:hover,.lang-menu button:focus-visible{background:var(--surface-2);outline:none}
.lang-menu button[aria-selected="true"]{font-weight:700}
.lang-menu button[aria-selected="true"]::after{content:"";margin-left:auto;margin-right:4px;width:5px;height:10px;border:solid var(--muted);border-width:0 2px 2px 0;transform:rotate(45deg) translateY(-2px)}

/* ---------- Donaciones ---------- */
:root{ --coffee:#FFDD00; --coffee-fg:#1b1a12 }
.coffee-btn{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 16px 0 13px;border-radius:999px;background:var(--coffee);color:var(--coffee-fg);font:700 14px var(--f-body);text-decoration:none;white-space:nowrap;box-shadow:0 1px 0 rgba(0,0,0,.08);transition:transform .15s, filter .15s}
.coffee-btn svg{width:20px;height:20px;flex:none}
.coffee-btn:hover{filter:brightness(1.04);transform:translateY(-1px)}
.coffee-btn:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.support{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px 24px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.support-txt{display:flex;flex-direction:column;gap:2px;min-width:0;max-width:60ch}
.support-txt b{font-family:var(--f-display);font-weight:400;font-size:20px}
.support-txt p{color:var(--muted);font-size:15px}
@media (max-width:420px){ .coffee-btn.compact span{display:none} .coffee-btn.compact{padding:0 12px} }

/* ---------- Footer ---------- */

  g2: {

  demos: {

    cot: { t: "Perché il segmento blu è §cot θ", s: [

    csc: { t: "Perché il segmento verde è §csc θ", s: [

    "rec-sin": { t: "§sin θ · §csc θ = 1", s: [

    "rec-cos": { t: "§cos θ · §sec θ = 1", s: [

    "quot-tan": { t: "§tan θ = §sin θ / §cos θ", s: [

    "pyth-cot": { t: "1 + §cot²θ = §csc²θ", s: [

    "sum-cos": { t: "Coseno di una somma e di una differenza", s: [

    s12e: "12 · Aplicaciones", s12h: "¿Para qué sirven los complejos?",
    uses: [
      ["Electricidad", "En corriente alterna, tensiones e intensidades son fasores. La impedancia Z = R + iX junta resistencia y reactancia en un solo número."],
      ["Señales y sonido", "La transformada de Fourier descompone cualquier señal en ondas e^{iωt}. Así funcionan el MP3, el JPEG o el 5G."],
      ["Gráficos y videojuegos", "Girar un punto un ángulo θ es multiplicarlo por e^{iθ}. Los cuaterniones, su versión 3D, giran cámaras y personajes."],
      ["Ecuaciones", "Teorema fundamental del álgebra: todo polinomio de grado n tiene exactamente n raíces en ℂ (contando repeticiones)."],
      ["Física cuántica", "La función de onda de una partícula es compleja; la probabilidad se obtiene con su módulo al cuadrado |ψ|²."],
      ["Fractales", "El conjunto de Mandelbrot sale de repetir z → z² + c con complejos y ver si el resultado se escapa."],
    ],
  },
  demos: {
    "cx-axiom": { t: "Definición axiomática: ℂ = (ℝ², +, ·)", p: "Un complejo es un par de reales con una regla especial para multiplicar. De ella sale i² = −1.", s: [
      "Un número complejo es un par ordenado de números reales (a, b). El primero es la parte real y el segundo la imaginaria.",
      "La suma se hace componente a componente, igual que con vectores.",
      "Para adivinar cómo debe ser el producto, multiplicamos (a + bi)(c + di) como dos binomios: cada término por cada término (propiedad distributiva).",
      "Usamos i² = −1, así que bd·i² = −bd. Agrupamos: lo que no lleva i es la parte real (ac − bd); lo que lleva i, la imaginaria (ad + bc).",
      "Esa regla es justamente la que se toma como definición del producto de pares. El símbolo := significa «se define como».",
      "Con esta definición, i = (0, 1) y al multiplicarlo por sí mismo sale (−1, 0), que es el real −1. Así i² = −1 ya no es un «número imposible», sino una consecuencia." ],
      u: "Los complejos se construyen solo con números reales, sin magia: son puntos del plano con una forma especial de multiplicar." },
    "cx-ipow": { t: "Potencias de i", p: "Las potencias de i se repiten cada 4: 1, i, −1, −i, 1, …", s: [
      "Partimos de la definición: i al cuadrado es −1.",
      "Para i³ multiplicamos una vez más por i: (−1)·i = −i.",
      "i⁴ = i²·i² = (−1)(−1) = 1. Hemos vuelto al principio.",
      "Como cada cuatro potencias se vuelve a 1, para calcular iⁿ basta mirar el resto r de dividir n entre 4 (r = 0, 1, 2 o 3).",
      "Ejemplo: 27 = 4·6 + 3, resto 3. Como i⁴ = 1, (i⁴)⁶ = 1, y queda i³ = −i." ],
      u: "Multiplicar por i es girar 90° en sentido antihorario; cuatro giros de 90° dan la vuelta completa. Por eso el ciclo es de 4." },
    "cx-field": { t: "ℂ es un cuerpo", p: "Suma y producto cumplen las reglas de siempre y todo z ≠ 0 tiene inverso.", s: [
      "Suma y producto son conmutativos (el orden no importa) y asociativos (da igual cómo agrupes). Se heredan de las reglas de ℝ.",
      "Se cumple la propiedad distributiva: multiplicar por una suma es sumar los productos.",
      "Hay elementos neutros: 0 = 0 + 0i no cambia nada al sumar y 1 = 1 + 0i no cambia nada al multiplicar.",
      "Todo z tiene opuesto −z, que sumado a z da 0.",
      "Inverso: para que el denominador sea real, multiplicamos arriba y abajo por a − bi (el conjugado). Abajo queda a² + b², que es positivo si z ≠ 0.",
      "Ejemplo: el inverso de 1 + i es (1 − i)/2. Comprobación: (1 + i)(1 − i)/2 = (1 − i²)/2 = 2/2 = 1." ],
      u: "Que ℂ sea un cuerpo significa que puedes despejar ecuaciones con complejos exactamente igual que con reales." },
    "cx-order": { t: "¿2 < i? No: ℂ no se puede ordenar", p: "No existe un orden en ℂ compatible con las operaciones. Comparar complejos con < no tiene sentido.", s: [
      "Un orden «compatible» (como el de ℝ) debe cumplir que el producto de dos positivos es positivo.",
      "Consecuencia: el cuadrado de cualquier número no nulo es positivo (si x < 0, entonces −x > 0 y x² = (−x)² > 0).",
      "Supongamos que existe ese orden en ℂ. Como i ≠ 0, tendría que ser i² > 0.",
      "Pero i² = −1, así que tendríamos −1 > 0.",
      "Por otro lado, 1 = 1² también es un cuadrado, así que 1 > 0.",
      "Sumando dos positivos (−1 y 1) el resultado debe ser positivo: 0 > 0. Eso es imposible, así que ese orden no existe." ],
      u: "En ℂ no se dice que un número es mayor que otro. Lo que sí se compara son sus módulos |z| y |w|, que son números reales." },
    "cx-phasor": { t: "Fasor: complejo de módulo 1", p: "Los complejos con |z| = 1 forman la circunferencia unidad: son el círculo trigonométrico.", s: [
      "Un fasor es un complejo z con |z| = 1. Recordamos que |z| = √(a² + b²).",
      "Elevando al cuadrado, |z| = 1 equivale a a² + b² = 1, que es la ecuación de la circunferencia de radio 1 centrada en el origen.",
      "Todo punto de esa circunferencia tiene coordenadas (cos θ, sen θ), como en el círculo trigonométrico.",
      "Por tanto todo fasor se escribe z = cos θ + i sen θ, que en polar es 1_θ y en exponencial e^{iθ}." ],
      u: "Multiplicar por un fasor gira sin cambiar el tamaño. En electricidad se usan para representar ondas sinusoidales." },
    "cx-conj1": { t: "El conjugado del conjugado", p: "Conjugar dos veces deja el número como estaba.", s: [
      "Conjugar es cambiar el signo de la parte imaginaria: de a + bi pasamos a a − bi.",
      "Volvemos a conjugar: la parte imaginaria ahora es −b, y le cambiamos el signo otra vez.",
      "−(−b) = b, así que recuperamos a + bi = z." ],
      u: "Geométricamente, conjugar es reflejar respecto al eje real; reflejar dos veces deja el punto donde estaba." },
    "cx-conj2": { t: "Conjugado de una suma", p: "Da igual sumar y luego conjugar que conjugar y luego sumar.", s: [
      "Escribimos los dos números en forma binómica.",
      "Sumamos partes reales con reales e imaginarias con imaginarias.",
      "Conjugamos el resultado: cambiamos el signo de la parte imaginaria.",
      "Separamos: es la suma de a − bi y c − di, es decir, z̄ + w̄." ],
      u: "Permite conjugar término a término expresiones largas, por ejemplo al simplificar fracciones." },
    "cx-conj3": { t: "Conjugado de un producto", p: "El conjugado de un producto es el producto de los conjugados. En particular, conj(zⁿ) = z̄ⁿ.", s: [
      "Producto en binómica (definición del producto).",
      "Lo conjugamos: solo cambia el signo de la parte imaginaria.",
      "Ahora multiplicamos los conjugados (a − bi)(c − di) término a término.",
      "Con i² = −1 sale (ac − bd) − (ad + bc)i: lo mismo que en el paso 2.",
      "Una potencia es un producto repetido, así que aplicando la regla n veces: conj(zⁿ) = (z̄)ⁿ." ],
      u: "Si un polinomio con coeficientes reales tiene una raíz compleja z, también tiene la raíz z̄: las raíces complejas van por parejas." },
    "cx-mod1": { t: "El módulo es ≥ 0 y solo vale 0 en z = 0", p: "|z| es una distancia: nunca es negativa y solo es 0 en el origen.", s: [
      "El módulo es la distancia del punto (a, b) al origen: por Pitágoras, la hipotenusa de catetos a y b.",
      "a² y b² son cuadrados, así que no son negativos; su suma tampoco, y su raíz tampoco.",
      "Una suma de cuadrados solo es 0 si los dos cuadrados son 0, es decir, a = 0 y b = 0.",
      "Ejemplo: |3 + 4i| = √(9 + 16) = √25 = 5 (el triángulo 3, 4, 5)." ],
      u: "El módulo mide el tamaño de un complejo. Es lo que se compara en lugar de los propios números." },
    "cx-tri": { t: "Desigualdad triangular", p: "El tamaño de una suma nunca supera la suma de los tamaños.", s: [
      "z + w es la diagonal del paralelogramo formado por las flechas z y w (regla del paralelogramo).",
      "Para ir de 0 a z + w podemos pasar por z: primero la flecha z (longitud |z|) y después una copia de w (longitud |w|). Se forma un triángulo.",
      "En un triángulo, un lado nunca es más largo que la suma de los otros dos: el camino directo es el más corto.",
      "La igualdad solo se da cuando z y w apuntan en la misma dirección: el triángulo se aplasta en un segmento.",
      "Ejemplo: |3 + 4i| = 5, mientras que |3| + |4i| = 3 + 4 = 7." ],
      u: "Sirve para acotar: si sabes lo grandes que son z y w, sabes como mucho lo grande que es z + w." },
    "cx-modprod": { t: "Módulo de un producto", p: "Al multiplicar complejos, los módulos se multiplican: |zw| = |z||w|.", s: [
      "Aplicamos la definición de módulo al producto zw = (ac − bd) + (ad + bc)i.",
      "Desarrollamos los dos cuadrados. Los términos −2abcd y +2abcd se anulan.",
      "Sacamos factor común: a² multiplica a (c² + d²) y b² también.",
      "Eso es |z|²·|w|². Como los módulos son ≥ 0, podemos quitar los cuadrados.",
      "Una potencia es un producto repetido, así que |zⁿ| = |z|ⁿ." ],
      u: "Es la mitad de la regla polar del producto: los tamaños se multiplican (la otra mitad: los ángulos se suman)." },
    "cx-modconj": { t: "Un número y su conjugado miden lo mismo", p: "|z| = |z̄|: reflejar no cambia la distancia al origen.", s: [
      "El conjugado de a + bi es a − bi.",
      "Al elevar al cuadrado, (−b)² = b², así que el módulo es el mismo." ],
      u: "z y z̄ están a la misma distancia del origen, con ángulos opuestos θ y −θ." },
    "cx-zz": { t: "z · z̄ = |z|²", p: "Un complejo por su conjugado siempre da un número real ≥ 0.", s: [
      "Multiplicamos z = a + bi por su conjugado a − bi.",
      "Desarrollamos: los términos −abi y +abi se anulan.",
      "Como i² = −1, −b²i² = +b².",
      "Queda a² + b², que es el módulo al cuadrado: un número real y no negativo." ],
      u: "Es el truco para dividir: multiplicar por el conjugado convierte un complejo en un número real." },
    "cx-div": { t: "División: z/w = z·w̄ / |w|²", p: "Para dividir, se multiplica arriba y abajo por el conjugado del denominador.", s: [
      "Multiplicamos numerador y denominador por w̄. Es multiplicar por w̄/w̄ = 1, así que el valor no cambia.",
      "Abajo queda w·w̄ = |w|², un número real. Dividir entre un real es fácil: se divide cada parte.",
      "Caso particular z = 1: el inverso de w es w̄/|w|².",
      "Ejemplo: (2 + 3i)/(1 + 2i). El conjugado de 1 + 2i es 1 − 2i y |1 + 2i|² = 1² + 2² = 5.",
      "Desarrollamos: 2 − 4i + 3i − 6i² = 2 + 6 − i = 8 − i. Dividimos cada parte entre 5." ],
      u: "Así se divide en forma binómica. En polar es aún más fácil: se dividen los módulos y se restan los ángulos." },
    "cx-arg": { t: "De binómica a polar (y el cuidado con arctan)", p: "ρ = √(a² + b²) y θ = arctan(b/a), corrigiendo según el cuadrante.", s: [
      "En el triángulo de catetos a (horizontal) y b (vertical) y de hipotenusa ρ, el seno es opuesto/hipotenusa y el coseno contiguo/hipotenusa.",
      "Dividiendo, tan θ = b/a, así que θ = arctan(b/a)… pero solo a veces.",
      "arctan solo devuelve ángulos entre −π/2 y π/2 (cuadrantes I y IV), que son los de a > 0. Ahí la fórmula es correcta.",
      "Si a < 0 el punto está a la izquierda: b/a da el mismo valor para z y para −z (el punto opuesto), así que hay que corregir sumando π (si b ≥ 0) o restando π (si b < 0).",
      "Si a = 0, b/a no existe: el punto está en el eje imaginario, θ = π/2 si b > 0 y −π/2 si b < 0.",
      "arg (con minúscula) es el conjunto de todos los ángulos válidos; Arg (con mayúscula) es el principal, el único que está en (−π, π]." ],
      u: "Cuidado con la calculadora: arctan((−1)/(−1)) = π/4, pero −1 − i está en el tercer cuadrante y su Arg es −3π/4." },
    "cx-p2b": { t: "De polar a binómica", p: "a = ρ cos θ y b = ρ sen θ. Así sale la forma trigonométrica.", s: [
      "De cos θ = a/ρ despejamos a multiplicando por ρ.",
      "De sen θ = b/ρ despejamos b igual.",
      "Sustituimos en a + bi y sacamos ρ factor común: es la forma trigonométrica ρ(cos θ + i sen θ).",
      "Ejemplo: 2_{π/3}. Como cos(π/3) = 1/2 y sen(π/3) = √3/2, queda 1 + √3 i." ],
      u: "La forma binómica va mejor para sumar y restar; la polar, para multiplicar, dividir, elevar y sacar raíces." },
    "cx-pprod": { t: "Producto en polar: se multiplican módulos y se suman ángulos", p: "(ρ₁)_{θ₁} · (ρ₂)_{θ₂} = (ρ₁ρ₂)_{θ₁+θ₂}", s: [
      "Escribimos los dos números en forma trigonométrica, con ángulos α y β.",
      "Los módulos ρ₁ y ρ₂ son números reales: los sacamos delante.",
      "Multiplicamos los dos paréntesis como binomios, con i² = −1, y agrupamos parte real e imaginaria.",
      "¡Son exactamente las fórmulas del coseno y del seno de la suma! (las de la pestaña α ± β).",
      "El resultado es un complejo de módulo ρ₁ρ₂ y ángulo α + β.",
      "Si α + β se sale de (−π, π], se le suma o resta 2π para dar el argumento principal: es el mismo punto." ],
      u: "Multiplicar = multiplicar tamaños y sumar giros. Por eso los complejos son perfectos para describir rotaciones." },
    "cx-pquot": { t: "Cociente en polar: se dividen módulos y se restan ángulos", p: "(ρ₁)_{θ₁} / (ρ₂)_{θ₂} = (ρ₁/ρ₂)_{θ₁−θ₂}", s: [
      "Dividir es buscar el número q que multiplicado por w da z.",
      "Escribimos q = r_φ y usamos la regla del producto: módulos multiplicados, ángulos sumados.",
      "Dos complejos en polar son iguales si tienen el mismo módulo y el mismo ángulo (salvo vueltas de 2π).",
      "Despejando: r = ρ₁/ρ₂ y φ = θ₁ − θ₂." ],
      u: "Dividir deshace el giro: se dividen los tamaños y se restan los ángulos." },
    "cx-pconj": { t: "Conjugado e inverso en polar", p: "z̄ = ρ_{−θ} y z⁻¹ = (1/ρ)_{−θ}", s: [
      "Escribimos ρ_θ en forma trigonométrica.",
      "Conjugar cambia el signo de la parte imaginaria. Como cos(−θ) = cos θ y sen(−θ) = −sen θ, es lo mismo que cambiar θ por −θ.",
      "Mismo módulo, ángulo opuesto: ρ_{−θ}.",
      "Para el inverso escribimos 1 = 1₀ (módulo 1, ángulo 0) y aplicamos la regla del cociente." ],
      u: "El inverso está en la misma dirección que el conjugado, pero con tamaño 1/ρ: si z está lejos del origen, 1/z está cerca." },
    "cx-moivre": { t: "Teorema de De Moivre", p: "(cos θ + i sen θ)ⁿ = cos nθ + i sen nθ. Elevar a n es multiplicar el ángulo por n.", s: [
      "Elevar a n es multiplicar el número n veces por sí mismo.",
      "Por la regla del producto, los módulos se multiplican (ρⁿ) y los ángulos se suman (θ + θ + … = nθ).",
      "Si el módulo es 1, queda 1 elevado a n, que es 1: solo cambia el ángulo.",
      "Escrito en forma trigonométrica, eso es el teorema de De Moivre.",
      "Ejemplo n = 2: desarrollando el cuadrado a la izquierda e igualando partes reales e imaginarias salen cos 2θ = cos²θ − sen²θ y sen 2θ = 2 sen θ cos θ.",
      "Ejemplo: 1 + i = √2_{π/4}. Elevado a 8: (√2)⁸ = 16 y 8·π/4 = 2π, que es una vuelta completa: el resultado es 16." ],
      u: "Calcular potencias grandes sin desarrollar binomios y deducir fórmulas de ángulos múltiplos (cos 3θ, sen 4θ…)." },
    "cx-rot": { t: "Multiplicar por 1_β es girar un ángulo β", p: "Al multiplicar por cos β + i sen β, todo el plano gira β alrededor del origen.", s: [
      "El punto 1 = (1, 0) se convierte en cos β + i sen β = (cos β, sen β).",
      "El punto i = (0, 1) se convierte en i cos β + i² sen β = −sen β + i cos β = (−sen β, cos β).",
      "Los dos ejes giran el mismo ángulo β, así que todo el plano gira β.",
      "Con β = 90°, multiplicar por 1_{90°} = i lleva el eje real al imaginario: girar 90°.",
      "Ejemplo de tus apuntes: girar 30° y después 90° es girar 120°, con sen 120° = √3/2 y cos 120° = −1/2." ],
      u: "Es la base de las rotaciones en gráficos por ordenador, robótica y animación." },
    "cx-euler": { t: "La fórmula de Euler", p: "e^{iθ} := cos θ + i sen θ. Es la forma exponencial de un fasor.", s: [
      "Es una definición: extiende la potencia de e a exponentes imaginarios. θ va siempre en radianes.",
      "Su módulo es 1 por el teorema de Pitágoras (sen²θ + cos²θ = 1): e^{iθ} siempre está en la circunferencia unidad.",
      "Su argumento es θ (si θ está en (−π, π]; si no, θ más o menos vueltas de 2π).",
      "Cualquier complejo en polar se puede escribir como ρ e^{iθ}: es la forma exponencial.",
      "Con θ = π sale e^{iπ} = −1, la identidad de Euler, que junta e, i, π, 1 y 0 en una sola fórmula." ],
      u: "Con la notación exponencial, operar con complejos es operar con potencias: e^{iα}·e^{iβ} = e^{i(α+β)}." },
    "cx-cossin": { t: "Seno y coseno con exponenciales", p: "Sumando y restando e^{iθ} y e^{−iθ} se despejan cos θ y sen θ.", s: [
      "Fórmula de Euler con θ.",
      "Fórmula de Euler con −θ. Como el coseno es par y el seno impar, sale cos θ − i sen θ: es el conjugado de e^{iθ}.",
      "Sumamos las dos: los senos se anulan y queda 2 cos θ.",
      "Dividimos entre 2.",
      "Restamos: los cosenos se anulan y queda 2i sen θ.",
      "Dividimos entre 2i." ],
      u: "Convierte productos de senos y cosenos en sumas de exponenciales, mucho más fáciles de integrar y derivar." },
    "cx-eprop": { t: "Propiedades de e^{iθ}", p: "Se comporta como una potencia normal: los exponentes se suman y se multiplican.", s: [
      "En polar, e^{iθ} = 1_θ. Multiplicar suma los ángulos: es sumar exponentes.",
      "Elevar a n multiplica el ángulo por n (De Moivre): es multiplicar el exponente por n.",
      "Con módulos cualesquiera: se multiplican los módulos y se suman los ángulos." ],
      u: "Las reglas de los exponentes funcionan igual que con números reales: e^a·e^b = e^{a+b} y (e^a)ⁿ = e^{na}." },
    "cx-roots": { t: "Raíces n-ésimas", p: "Todo z ≠ 0 tiene n raíces n-ésimas, con módulo ⁿ√ρ y ángulos (θ + 2πk)/n.", s: [
      "Buscamos todos los w = r_φ tales que wⁿ = z.",
      "Por De Moivre, wⁿ tiene módulo rⁿ y ángulo nφ.",
      "Igualamos módulos: rⁿ = ρ, así que r es la raíz n-ésima real (positiva) de ρ.",
      "Igualamos ángulos, pero los ángulos pueden diferir en vueltas completas: nφ = θ + 2πk. Despejamos φ.",
      "Con k = n volvemos al ángulo de k = 0 (hemos dado una vuelta entera), así que basta con k = 0, 1, …, n − 1: hay n raíces distintas.",
      "Dos raíces seguidas se separan 2π/n: forman un polígono regular de n lados centrado en el origen." ],
      u: "Resolver ecuaciones como zⁿ = c. En ℝ, x³ = 8 solo tiene una solución; en ℂ tiene tres." },
    "cx-root1": { t: "Ejemplo: las raíces cúbicas de 1", p: "∛1 = {1, ω, ω²} con ω = −1/2 + (√3/2)i.", s: [
      "Escribimos 1 en polar: módulo 1 y ángulo 0.",
      "Aplicamos la fórmula con n = 3. La raíz real de 1 es 1, así que todas tienen módulo 1.",
      "k = 0: ángulo 0, la raíz real 1.",
      "k = 1: ángulo 2π/3 = 120°. cos 120° = −1/2 y sen 120° = √3/2. A esta raíz se le llama ω.",
      "k = 2: ángulo 4π/3 = 240°. Es el conjugado de ω, y también ω² (dos giros de 120°).",
      "k = 3 daría 2π = 360°: volvemos a 1. Por eso solo hay 3 raíces." ],
      u: "Las raíces cúbicas de la unidad forman un triángulo equilátero y aparecen al resolver ecuaciones de tercer grado." },
    "cx-z38": { t: "Ejemplo: z³ − 8 = 0", p: "Las soluciones son 2 y −1 ± √3 i: las raíces cúbicas de 1 multiplicadas por 2.", s: [
      "Despejamos: z es una raíz cúbica de 8.",
      "Truco: como 8 = 2³, dividimos la ecuación entre 8 y queda (z/2)³ = 1.",
      "Entonces z/2 es una raíz cúbica de 1, que ya conocemos.",
      "Multiplicando por 2: z = 2, z = −1 + √3 i y z = −1 − √3 i.",
      "Con la fórmula directa: 8 = 8₀, su raíz cúbica real es 2 y los ángulos son 0, 2π/3 y 4π/3. Sale lo mismo." ],
      u: "En ℝ esta ecuación solo tiene la solución 2. En ℂ aparecen las tres, en un triángulo equilátero de radio 2." },
    "cx-exp": { t: "Exponencial compleja e^z", p: "e^{a+bi} = e^a (cos b + i sen b): módulo e^a y ángulo b.", s: [
      "Se define para que siga cumpliéndose e^{x+y} = e^x · e^y.",
      "e^a es un real positivo y e^{bi} es un fasor de ángulo b: el resultado ya está en forma polar.",
      "El módulo de e^z depende solo de la parte real de z.",
      "El ángulo de e^z es la parte imaginaria de z (más vueltas completas).",
      "Sumar 2πi añade una vuelta completa y no cambia nada: e^z es periódica de periodo 2πi.",
      "Ejemplo: e^{1 + iπ/2} = e · e^{iπ/2} = e · i." ],
      u: "Describe oscilaciones que crecen o se amortiguan: la parte real controla el tamaño y la imaginaria el giro (circuitos RLC, muelles)." },
    "cx-log": { t: "Logaritmo complejo", p: "log z = ln|z| + i arg z. Tiene infinitos valores, separados 2πi.", s: [
      "El logaritmo de z es el número w que hay que poner en el exponente para obtener z: e^w = z.",
      "Escribimos w = x + yi. Entonces e^w tiene módulo e^x y ángulo y; z tiene módulo ρ y ángulo θ.",
      "Igualamos módulos: e^x = ρ, así que x es el logaritmo neperiano (real) de |z|.",
      "Igualamos ángulos salvo vueltas: y = θ + 2πk. Hay infinitos logaritmos, uno por cada k.",
      "El logaritmo principal Log z usa el argumento principal Arg z ∈ (−π, π] (k = 0).",
      "Ejemplo: −1 tiene módulo 1 y ángulo π, así que Log(−1) = ln 1 + iπ = iπ. ¡En ℂ los negativos sí tienen logaritmo!" ],
      u: "Permite definir potencias complejas como z^w = e^{w·log z} y resolver ecuaciones exponenciales en ℂ." },
  },
};

  g: {
    s1e: "01 · Definition", s1h: "What is a complex number?",
    s1l: "The equation x² + 1 = 0 has no real solution, because no real number squared gives −1. We add a new number, i, with i² = −1, and build all complex numbers from it.",
    defs1: [
      ["Imaginary unit", '<span class="mr"><i>i</i> = √−1</span>, that is, <span class="mr"><i>i</i>² = −1</span>.'],
      ["Rectangular (binomial) form", '<span class="mr"><i>z</i> = <i>a</i> + <i>bi</i></span>, with <span class="mr"><i>a</i></span> and <span class="mr"><i>b</i></span> real numbers. It has two terms, hence “binomial”.'],
      ["Real part", '<span class="mr">Re(<i>z</i>) = <i>a</i></span>: the term without <span class="mr"><i>i</i></span>.'],
      ["Imaginary part", '<span class="mr">Im(<i>z</i>) = <i>b</i></span>: the number multiplying <span class="mr"><i>i</i></span> (without the <span class="mr"><i>i</i></span>).'],
      ["The set ℂ", '<span class="mr">ℂ = {<i>a</i> + <i>bi</i> : <i>a</i>, <i>b</i> ∈ ℝ}</span>. Real numbers are the complex numbers with <span class="mr"><i>b</i> = 0</span>.'],
    ],
    s2e: "02 · Structure", s2h: "ℂ is a field… but it can't be ordered",
    s2l: "A field is a set where you can add, subtract, multiply and divide (except by 0) with the usual rules. ℂ is one, but it loses something ℝ has: order.",
    s3e: "03 · Graphical representation", s3h: "The complex plane",
    s3l: "Since a complex number is a pair (a, b), it's drawn as a point of the plane or as an arrow (vector) from the origin.",
    s3p: 'The <b>X</b> axis is the <b>real axis</b>: points (x, 0) are the real numbers x. The <b>Y</b> axis is the <b>imaginary axis</b>: points (0, y) are the pure imaginaries yi. The drawing shows the examples from your notes: <span class="mr"><i>z</i> = 2 − <i>i</i></span> and <span class="mr"><i>w</i> = 1 + 2<i>i</i></span>.',
    load: "Show z = 2 − i and w = 1 + 2i on the plane",
    s4e: "04 · Conjugate", s4h: "The conjugate z̄",
    s4l: "The conjugate of z = a + bi is z̄ = a − bi: flip the sign of the imaginary part. On the plane it's the reflection of z across the real axis (like a mirror).",
    s5e: "05 · Modulus", s5h: "The modulus |z|",
    s5l: "The modulus |z| = √(a² + b²) is the length of the arrow, that is, the distance from z to the origin. It comes from Pythagoras' theorem with legs a and b.",
    s6e: "06 · Polar form", s6h: "Polar form ρ_θ",
    s6l: "A point is also fixed by two pieces of data: how far it is from the origin and the angle it makes with the positive real axis. Like giving directions as “5 km, heading north-east”.",
    defs6: [
      ["ρ (rho): modulus", '<span class="mr"><i>ρ</i> := |<i>z</i>|</span>, the distance to the origin.'],
      ["θ (theta): principal argument", '<span class="mr"><i>θ</i> := Arg(<i>z</i>) ∈ (−π, π]</span>, the angle measured from the positive real axis; counterclockwise is positive.'],
      ["arg(z): every argument", '<span class="mr">arg(<i>z</i>) = {<i>θ</i> + 2π<i>n</i> : <i>n</i> ∈ ℤ}</span>. Full turns (2π = 360°) lead to the same point.'],
      ["Polar notation", '<span class="mr"><i>z</i> = <i>ρ</i><sub><i>θ</i></sub></span>, where <span class="mr"><i>ρ</i> = |<i>z</i>|</span> and <span class="mr"><i>θ</i> = Arg(<i>z</i>)</span>.'],
    ],
    formsH: ["Form", "Notation", "z = 1 + i", "w = 1 − i"],
    s7e: "07 · Operations in polar form", s7h: "Multiplying is rotating",
    s7l: "In polar form, operations are very simple: when multiplying, the moduli multiply and the angles add. That's why multiplying by a complex number rotates and stretches.",
    s8e: "08 · De Moivre", s8h: "De Moivre's theorem",
    s8l: "Raising to a power means multiplying the same number several times, so the angle gets added to itself n times.",
    s9e: "09 · Exponential form", s9h: "Euler's formula: e^{iθ}",
    s9l: "With the exponential form, the rules of complex numbers become the rules of powers you already know.",
    s9p: 'What does a power mean? <span class="mr">2³ = 2 · 2 · 2</span> makes sense by counting. But <span class="mr">π²</span> is no longer “π times”, and <span class="mr">2<sup>π</sup></span> even less: they are <b>definitions</b> that extend the idea while keeping its rules. <span class="mr"><i>e</i><sup><i>iθ</i></sup></span> is the same: it’s defined so that <span class="mr"><i>e</i><sup><i>a</i></sup><i>e</i><sup><i>b</i></sup> = <i>e</i><sup><i>a</i>+<i>b</i></sup></span> still holds.',
    s10e: "10 · Roots", s10h: "n-th roots",
    s10l: "In ℂ, every nonzero number has exactly n distinct n-th roots, spread out like the vertices of a regular polygon.",
    s11e: "11 · Exponential and logarithm", s11h: "e^z and log z in ℂ",
    s11l: "The exponential extends to any complex exponent; its inverse, the logarithm, exists even for negative numbers, but it has infinitely many values.",
    s12e: "12 · Applications", s12h: "What are complex numbers for?",
    uses: [
      ["Electricity", "In AC circuits, voltages and currents are phasors. The impedance Z = R + iX packs resistance and reactance into a single number."],
      ["Signals and sound", "The Fourier transform breaks any signal into waves e^{iωt}. That's how MP3, JPEG and 5G work."],
      ["Graphics and games", "Rotating a point by θ is multiplying it by e^{iθ}. Quaternions, their 3D version, rotate cameras and characters."],
      ["Equations", "Fundamental theorem of algebra: every polynomial of degree n has exactly n roots in ℂ (counting repeats)."],
      ["Quantum physics", "A particle's wave function is complex; probabilities come from its modulus squared |ψ|²."],
      ["Fractals", "The Mandelbrot set comes from repeating z → z² + c with complex numbers and checking whether the result escapes."],
    ],
  },
  demos: {
    "cx-axiom": { t: "Axiomatic definition: ℂ = (ℝ², +, ·)", p: "A complex number is a pair of reals with a special multiplication rule. i² = −1 follows from it.", s: [
      "A complex number is an ordered pair of real numbers (a, b). The first is the real part and the second the imaginary part.",
      "Addition is done component by component, just like with vectors.",
      "To guess what the product should be, we multiply (a + bi)(c + di) like two binomials: every term by every term (distributive property).",
      "We use i² = −1, so bd·i² = −bd. Grouping: what has no i is the real part (ac − bd); what has i, the imaginary part (ad + bc).",
      "That rule is exactly what's taken as the definition of the product of pairs. The symbol := means “is defined as”.",
      "With this definition, i = (0, 1), and multiplying it by itself gives (−1, 0), which is the real number −1. So i² = −1 is no longer an “impossible number” but a consequence." ],
      u: "Complex numbers are built from real numbers alone, no magic: they are points of the plane with a special way of multiplying." },
    "cx-ipow": { t: "Powers of i", p: "Powers of i repeat every 4: 1, i, −1, −i, 1, …", s: [
      "Start from the definition: i squared is −1.",
      "For i³ multiply by i once more: (−1)·i = −i.",
      "i⁴ = i²·i² = (−1)(−1) = 1. We're back to the start.",
      "Since every four powers we're back to 1, to compute iⁿ we only need the remainder r of dividing n by 4 (r = 0, 1, 2 or 3).",
      "Example: 27 = 4·6 + 3, remainder 3. Since i⁴ = 1, (i⁴)⁶ = 1, leaving i³ = −i." ],
      u: "Multiplying by i rotates 90° counterclockwise; four 90° turns make a full turn. That's why the cycle has length 4." },
    "cx-field": { t: "ℂ is a field", p: "Addition and multiplication follow the usual rules and every z ≠ 0 has an inverse.", s: [
      "Addition and multiplication are commutative (order doesn't matter) and associative (grouping doesn't matter). They inherit this from ℝ.",
      "The distributive property holds: multiplying by a sum is adding the products.",
      "There are identity elements: 0 = 0 + 0i changes nothing when added, and 1 = 1 + 0i changes nothing when multiplied.",
      "Every z has an opposite −z, which added to z gives 0.",
      "Inverse: to make the denominator real, multiply top and bottom by a − bi (the conjugate). The bottom becomes a² + b², which is positive if z ≠ 0.",
      "Example: the inverse of 1 + i is (1 − i)/2. Check: (1 + i)(1 − i)/2 = (1 − i²)/2 = 2/2 = 1." ],
      u: "ℂ being a field means you can solve equations with complex numbers exactly like with real ones." },
    "cx-order": { t: "Is 2 < i? No: ℂ can't be ordered", p: "There is no order on ℂ compatible with its operations. Comparing complex numbers with < makes no sense.", s: [
      "A “compatible” order (like the one on ℝ) must make the product of two positives positive.",
      "Consequence: the square of any nonzero number is positive (if x < 0, then −x > 0 and x² = (−x)² > 0).",
      "Suppose such an order exists on ℂ. Since i ≠ 0, we'd need i² > 0.",
      "But i² = −1, so we'd get −1 > 0.",
      "On the other hand, 1 = 1² is also a square, so 1 > 0.",
      "Adding two positives (−1 and 1) must give a positive number: 0 > 0. That's impossible, so no such order exists." ],
      u: "In ℂ you never say one number is bigger than another. What you can compare is their moduli |z| and |w|, which are real numbers." },
    "cx-phasor": { t: "Phasor: a complex number of modulus 1", p: "Complex numbers with |z| = 1 form the unit circle: they are the trigonometric circle.", s: [
      "A phasor is a complex z with |z| = 1. Recall that |z| = √(a² + b²).",
      "Squaring, |z| = 1 means a² + b² = 1, the equation of the circle of radius 1 centred at the origin.",
      "Every point on that circle has coordinates (cos θ, sin θ), as on the trigonometric circle.",
      "So every phasor can be written z = cos θ + i sin θ, which is 1_θ in polar form and e^{iθ} in exponential form." ],
      u: "Multiplying by a phasor rotates without changing size. In electricity they represent sinusoidal waves." },
    "cx-conj1": { t: "The conjugate of the conjugate", p: "Conjugating twice leaves the number as it was.", s: [
      "Conjugating flips the sign of the imaginary part: a + bi becomes a − bi.",
      "Conjugate again: the imaginary part is now −b, and we flip its sign once more.",
      "−(−b) = b, so we get back a + bi = z." ],
      u: "Geometrically, conjugating is reflecting across the real axis; reflecting twice leaves the point where it was." },
    "cx-conj2": { t: "Conjugate of a sum", p: "Adding then conjugating is the same as conjugating then adding.", s: [
      "Write both numbers in rectangular form.",
      "Add real parts to real parts and imaginary parts to imaginary parts.",
      "Conjugate the result: flip the sign of the imaginary part.",
      "Split it up: it's the sum of a − bi and c − di, that is, z̄ + w̄." ],
      u: "It lets you conjugate long expressions term by term, for example when simplifying fractions." },
    "cx-conj3": { t: "Conjugate of a product", p: "The conjugate of a product is the product of the conjugates. In particular, conj(zⁿ) = z̄ⁿ.", s: [
      "Product in rectangular form (definition of the product).",
      "Conjugate it: only the sign of the imaginary part changes.",
      "Now multiply the conjugates (a − bi)(c − di) term by term.",
      "With i² = −1 we get (ac − bd) − (ad + bc)i: the same as in step 2.",
      "A power is a repeated product, so applying the rule n times: conj(zⁿ) = (z̄)ⁿ." ],
      u: "If a polynomial with real coefficients has a complex root z, it also has the root z̄: complex roots come in pairs." },
    "cx-mod1": { t: "The modulus is ≥ 0 and only 0 at z = 0", p: "|z| is a distance: never negative, and 0 only at the origin.", s: [
      "The modulus is the distance from (a, b) to the origin: by Pythagoras, the hypotenuse with legs a and b.",
      "a² and b² are squares, so they aren't negative; neither is their sum, nor its square root.",
      "A sum of squares is 0 only if both squares are 0, that is, a = 0 and b = 0.",
      "Example: |3 + 4i| = √(9 + 16) = √25 = 5 (the 3-4-5 triangle)." ],
      u: "The modulus measures the size of a complex number. It's what gets compared instead of the numbers themselves." },
    "cx-tri": { t: "Triangle inequality", p: "The size of a sum never exceeds the sum of the sizes.", s: [
      "z + w is the diagonal of the parallelogram formed by the arrows z and w (parallelogram rule).",
      "To get from 0 to z + w we can go through z: first the arrow z (length |z|), then a copy of w (length |w|). That makes a triangle.",
      "In a triangle, one side is never longer than the other two combined: the direct path is the shortest.",
      "Equality only happens when z and w point the same way: the triangle flattens into a segment.",
      "Example: |3 + 4i| = 5, while |3| + |4i| = 3 + 4 = 7." ],
      u: "It gives bounds: if you know how big z and w are, you know at most how big z + w is." },
    "cx-modprod": { t: "Modulus of a product", p: "When multiplying complex numbers, the moduli multiply: |zw| = |z||w|.", s: [
      "Apply the definition of modulus to the product zw = (ac − bd) + (ad + bc)i.",
      "Expand both squares. The terms −2abcd and +2abcd cancel.",
      "Factor: a² multiplies (c² + d²) and so does b².",
      "That's |z|²·|w|². Since moduli are ≥ 0, we can drop the squares.",
      "A power is a repeated product, so |zⁿ| = |z|ⁿ." ],
      u: "It's half of the polar product rule: sizes multiply (the other half: angles add)." },
    "cx-modconj": { t: "A number and its conjugate have the same size", p: "|z| = |z̄|: reflecting doesn't change the distance to the origin.", s: [
      "The conjugate of a + bi is a − bi.",
      "When squaring, (−b)² = b², so the modulus is the same." ],
      u: "z and z̄ are at the same distance from the origin, with opposite angles θ and −θ." },
    "cx-zz": { t: "z · z̄ = |z|²", p: "A complex number times its conjugate is always a real number ≥ 0.", s: [
      "Multiply z = a + bi by its conjugate a − bi.",
      "Expand: the terms −abi and +abi cancel.",
      "Since i² = −1, −b²i² = +b².",
      "We're left with a² + b², the modulus squared: a real, non-negative number." ],
      u: "It's the trick for dividing: multiplying by the conjugate turns a complex number into a real one." },
    "cx-div": { t: "Division: z/w = z·w̄ / |w|²", p: "To divide, multiply top and bottom by the conjugate of the denominator.", s: [
      "Multiply numerator and denominator by w̄. That's multiplying by w̄/w̄ = 1, so the value doesn't change.",
      "The bottom becomes w·w̄ = |w|², a real number. Dividing by a real number is easy: divide each part.",
      "Special case z = 1: the inverse of w is w̄/|w|².",
      "Example: (2 + 3i)/(1 + 2i). The conjugate of 1 + 2i is 1 − 2i and |1 + 2i|² = 1² + 2² = 5.",
      "Expand: 2 − 4i + 3i − 6i² = 2 + 6 − i = 8 − i. Divide each part by 5." ],
      u: "That's how you divide in rectangular form. In polar form it's even easier: divide the moduli and subtract the angles." },
    "cx-arg": { t: "From rectangular to polar (and the arctan trap)", p: "ρ = √(a² + b²) and θ = arctan(b/a), corrected by quadrant.", s: [
      "In the triangle with legs a (horizontal) and b (vertical) and hypotenuse ρ, sine is opposite/hypotenuse and cosine is adjacent/hypotenuse.",
      "Dividing, tan θ = b/a, so θ = arctan(b/a)… but only sometimes.",
      "arctan only returns angles between −π/2 and π/2 (quadrants I and IV), which are the ones with a > 0. There the formula is right.",
      "If a < 0 the point is on the left: b/a gives the same value for z and for −z (the opposite point), so we must correct by adding π (if b ≥ 0) or subtracting π (if b < 0).",
      "If a = 0, b/a doesn't exist: the point is on the imaginary axis, θ = π/2 if b > 0 and −π/2 if b < 0.",
      "arg (lowercase) is the set of all valid angles; Arg (capital) is the principal one, the only one in (−π, π]." ],
      u: "Careful with calculators: arctan((−1)/(−1)) = π/4, but −1 − i is in the third quadrant and its Arg is −3π/4." },
    "cx-p2b": { t: "From polar to rectangular", p: "a = ρ cos θ and b = ρ sin θ. This gives the trigonometric form.", s: [
      "From cos θ = a/ρ, solve for a by multiplying by ρ.",
      "From sin θ = b/ρ, solve for b the same way.",
      "Substitute into a + bi and factor out ρ: that's the trigonometric form ρ(cos θ + i sin θ).",
      "Example: 2_{π/3}. Since cos(π/3) = 1/2 and sin(π/3) = √3/2, we get 1 + √3 i." ],
      u: "Rectangular form is best for adding and subtracting; polar form for multiplying, dividing, powers and roots." },
    "cx-pprod": { t: "Product in polar form: multiply moduli, add angles", p: "(ρ₁)_{θ₁} · (ρ₂)_{θ₂} = (ρ₁ρ₂)_{θ₁+θ₂}", s: [
      "Write both numbers in trigonometric form, with angles α and β.",
      "The moduli ρ₁ and ρ₂ are real numbers: move them to the front.",
      "Multiply the two brackets like binomials, with i² = −1, and group real and imaginary parts.",
      "They are exactly the angle-sum formulas for cosine and sine! (the ones in the α ± β tab).",
      "The result is a complex number with modulus ρ₁ρ₂ and angle α + β.",
      "If α + β falls outside (−π, π], add or subtract 2π to get the principal argument: it's the same point." ],
      u: "Multiplying = multiplying sizes and adding turns. That's why complex numbers are perfect for describing rotations." },
    "cx-pquot": { t: "Quotient in polar form: divide moduli, subtract angles", p: "(ρ₁)_{θ₁} / (ρ₂)_{θ₂} = (ρ₁/ρ₂)_{θ₁−θ₂}", s: [
      "Dividing means finding the number q that, multiplied by w, gives z.",
      "Write q = r_φ and use the product rule: moduli multiply, angles add.",
      "Two complex numbers in polar form are equal if they have the same modulus and the same angle (up to full turns of 2π).",
      "Solving: r = ρ₁/ρ₂ and φ = θ₁ − θ₂." ],
      u: "Dividing undoes the turn: sizes divide and angles subtract." },
    "cx-pconj": { t: "Conjugate and inverse in polar form", p: "z̄ = ρ_{−θ} and z⁻¹ = (1/ρ)_{−θ}", s: [
      "Write ρ_θ in trigonometric form.",
      "Conjugating flips the sign of the imaginary part. Since cos(−θ) = cos θ and sin(−θ) = −sin θ, that's the same as replacing θ with −θ.",
      "Same modulus, opposite angle: ρ_{−θ}.",
      "For the inverse, write 1 = 1₀ (modulus 1, angle 0) and apply the quotient rule." ],
      u: "The inverse points the same way as the conjugate, but with size 1/ρ: if z is far from the origin, 1/z is close to it." },
    "cx-moivre": { t: "De Moivre's theorem", p: "(cos θ + i sin θ)ⁿ = cos nθ + i sin nθ. Raising to n multiplies the angle by n.", s: [
      "Raising to n means multiplying the number by itself n times.",
      "By the product rule, the moduli multiply (ρⁿ) and the angles add (θ + θ + … = nθ).",
      "If the modulus is 1, we get 1 to the n, which is 1: only the angle changes.",
      "Written in trigonometric form, that's De Moivre's theorem.",
      "Example n = 2: expanding the square on the left and matching real and imaginary parts gives cos 2θ = cos²θ − sin²θ and sin 2θ = 2 sin θ cos θ.",
      "Example: 1 + i = √2_{π/4}. To the 8th: (√2)⁸ = 16 and 8·π/4 = 2π, a full turn: the result is 16." ],
      u: "Compute large powers without expanding binomials, and derive multiple-angle formulas (cos 3θ, sin 4θ…)." },
    "cx-rot": { t: "Multiplying by 1_β rotates by β", p: "Multiplying by cos β + i sin β rotates the whole plane by β around the origin.", s: [
      "The point 1 = (1, 0) becomes cos β + i sin β = (cos β, sin β).",
      "The point i = (0, 1) becomes i cos β + i² sin β = −sin β + i cos β = (−sin β, cos β).",
      "Both axes rotate by the same angle β, so the whole plane rotates by β.",
      "With β = 90°, multiplying by 1_{90°} = i takes the real axis to the imaginary one: a 90° turn.",
      "Example from your notes: rotating 30° and then 90° is rotating 120°, with sin 120° = √3/2 and cos 120° = −1/2." ],
      u: "It's the basis of rotations in computer graphics, robotics and animation." },
    "cx-euler": { t: "Euler's formula", p: "e^{iθ} := cos θ + i sin θ. It's the exponential form of a phasor.", s: [
      "It's a definition: it extends powers of e to imaginary exponents. θ is always in radians.",
      "Its modulus is 1 by Pythagoras (sin²θ + cos²θ = 1): e^{iθ} always lies on the unit circle.",
      "Its argument is θ (if θ is in (−π, π]; otherwise θ plus or minus full turns of 2π).",
      "Any complex number in polar form can be written ρ e^{iθ}: the exponential form.",
      "With θ = π we get e^{iπ} = −1, Euler's identity, which puts e, i, π, 1 and 0 into a single formula." ],
      u: "With exponential notation, working with complex numbers is working with powers: e^{iα}·e^{iβ} = e^{i(α+β)}." },
    "cx-cossin": { t: "Sine and cosine as exponentials", p: "Adding and subtracting e^{iθ} and e^{−iθ} isolates cos θ and sin θ.", s: [
      "Euler's formula with θ.",
      "Euler's formula with −θ. Since cosine is even and sine is odd, we get cos θ − i sin θ: the conjugate of e^{iθ}.",
      "Add them: the sines cancel, leaving 2 cos θ.",
      "Divide by 2.",
      "Subtract them: the cosines cancel, leaving 2i sin θ.",
      "Divide by 2i." ],
      u: "It turns products of sines and cosines into sums of exponentials, which are much easier to integrate and differentiate." },
    "cx-eprop": { t: "Properties of e^{iθ}", p: "It behaves like an ordinary power: exponents add and multiply.", s: [
      "In polar form, e^{iθ} = 1_θ. Multiplying adds the angles: that's adding exponents.",

    for (let a = 0; a < 360; a += 15) { if (a % 45 && a % 30) continue; const qx = Math.cos(rad(a)), qy = Math.sin(rad(a)), d = Math.hypot(x - qx, y - qy); if (d < bd) { best = [qx, qy]; bd = d; } }
    return best ?? [Math.round(x * 20) / 20, Math.round(y * 20) / 20];
  }
  let dragC = null;
  svg3.addEventListener("pointerdown", e => {
    const [x, y] = ptMath(e);
    const dz = Math.hypot(x - cx.z.re, y - cx.z.im), dw = USESW[cx.op] ? Math.hypot(x - cx.w.re, y - cx.w.im) : Infinity;
    dragC = dw < dz ? "w" : "z";
    svg3.setPointerCapture(e.pointerId); cx[dragC] = Cx(...snapPt(x, y)); renderCX(); e.preventDefault();
  });
  svg3.addEventListener("pointermove", e => { if (!dragC) return; cx[dragC] = Cx(...snapPt(...ptMath(e))); renderCX(); });
  svg3.addEventListener("pointerup", () => dragC = null); svg3.addEventListener("pointercancel", () => dragC = null);
  [[hZ, "z"], [hW, "w"]].forEach(([h, nm]) => h.addEventListener("keydown", e => {
    const st_ = e.shiftKey || !cx.snap ? .05 : .5, d = { ArrowRight: [st_, 0], ArrowLeft: [-st_, 0], ArrowUp: [0, st_], ArrowDown: [0, -st_] }[e.key];
    if (!d) return; e.preventDefault();
    const zz = cx[nm], nx = Math.max(-R3, Math.min(R3, Math.round((zz.re + d[0]) * 100) / 100)), ny = Math.max(-R3, Math.min(R3, Math.round((zz.im + d[1]) * 100) / 100));
    cx[nm] = Cx(nx, ny); renderCX();
  }));

  /* ---- guía ---- */
  const cxCard = (id, live) => { const D = cxD().demos?.[id] ?? CX.es.demos[id]; return `<div class="id demo" data-demo="${id}" role="button" tabindex="0"><h3>${LX(D.t)}</h3><div class="f">${LX(CXF[id].stmt)}</div><p>${LX(D.p)}</p>${live ? `<div class="live" id="lv-${id}"></div>` : ""}${more()}</div>`; };
  const cards = (ids, live = []) => `<div class="ids">${ids.map(id => cxCard(id, live.includes(id))).join("")}</div>`;
  function renderGuide3() {
    const g = p => ct("g." + p);
    const defs1 = ct("g.defs1"), defs6 = ct("g.defs6");
    const defBox = arr => `<div class="defs">${arr.map(([h, p]) => `<div class="def-item"><b>${LX(h)}</b>${LX(p)}</div>`).join("")}</div>`;
    const figPlane = (() => { const M = MP({ s: 40, ox: 150, oy: 120, h: 240 }); const z = [2, -1], w = [1, 2];
      let s = M.axes(-3.2, 3.4, -2.6, 2.7);
      for (let i = -3; i <= 3; i++) if (i) s += `<text x="${M.px(i)}" y="${M.py(0) + 15}" text-anchor="middle" font-size="11" fill="var(--muted)">${minus(String(i))}</text>` + (Math.abs(i) < 3 ? `<text x="${M.px(0) - 5}" y="${M.py(i) + 4}" text-anchor="end" font-size="11" fill="var(--muted)" font-style="italic">${i === 1 ? "i" : i === -1 ? "−i" : minus(String(i)) + "i"}</text>` : "");
      s += M.ln(...z, z[0], 0, "var(--muted)", 1, "3 3") + M.ln(...z, 0, z[1], "var(--muted)", 1, "3 3") + M.ln(...w, w[0], 0, "var(--muted)", 1, "3 3") + M.ln(...w, 0, w[1], "var(--muted)", 1, "3 3");
      s += M.ar(0, 0, ...z, "var(--c-z)", 2.8) + M.ar(0, 0, ...w, "var(--c-w)", 2.8) + M.dot(...z, "var(--c-z)") + M.dot(...w, "var(--c-w)");
      s += M.tx(z[0] + .15, z[1] - .1, "z = 2 − i", "var(--c-z)", "start", 14, true) + M.tx(w[0] + .15, w[1] + .1, "w = 1 + 2i", "var(--c-w)", "start", 14, true);
      return M.svg(s); })();
    const ex1 = Cx(1, 1), ex2 = Cx(1, -1);
    const formsTable = `<div class="tablewrap"><table class="big forms"><thead><tr>${ct("g.formsH").map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>${[
      [ct("ui.rowBin"), m("a + bi"), "1 + <i>i</i>", "1 − <i>i</i>"],
      [ct("ui.rowPol"), m(sb("ρ", "θ")), polH(ex1, "rad"), polH(ex2, "rad")],
      [ct("ui.rowTrig"), m(`ρ(${COS} θ + i ${SIN} θ)`), trigH(ex1, "rad"), trigH(ex2, "rad")],
      [ct("ui.rowExp"), m(`ρ${ex_("iθ")}`), expH(ex1), expH(ex2)]].map(rw => `<tr>${rw.map((c, i) => `<td>${i ? LX(c) : c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
    const loadBtn = (q, txt) => `<button type="button" class="linkbtn" data-cxq="${q}">${txt}</button>`;
    $("guide3").innerHTML =
      sec(g("s1e"), g("s1h"), defBox(defs1) + cards(["cx-axiom", "cx-ipow"]), g("s1l")) +
      sec(g("s2e"), g("s2h"), cards(["cx-field", "cx-order"]), g("s2l")) +
      sec(g("s3e"), g("s3h"), `<div class="split"><div class="fig-inline">${figPlane}</div><div class="split-txt"><p>${g("s3p")}</p><div class="ex-row">${loadBtn(1, g("load"))}</div></div></div>` + cards(["cx-phasor"]), g("s3l")) +
      sec(g("s4e"), g("s4h"), cards(["cx-conj1", "cx-conj2", "cx-conj3"]), g("s4l")) +
      sec(g("s5e"), g("s5h"), cards(["cx-mod1", "cx-tri", "cx-modprod", "cx-modconj", "cx-zz", "cx-div"], ["cx-tri", "cx-modprod", "cx-zz", "cx-div"]), g("s5l")) +
      sec(g("s6e"), g("s6h"), defBox(defs6) + formsTable + cards(["cx-arg", "cx-p2b"], ["cx-arg"]), g("s6l")) +
      sec(g("s7e"), g("s7h"), cards(["cx-pprod", "cx-pquot", "cx-pconj", "cx-rot"], ["cx-pprod"]), g("s7l")) +
      sec(g("s8e"), g("s8h"), cards(["cx-moivre"], ["cx-moivre"]), g("s8l")) +
      sec(g("s9e"), g("s9h"), `<p>${g("s9p")}</p>` + cards(["cx-euler", "cx-cossin", "cx-eprop"]), g("s9l")) +
      sec(g("s10e"), g("s10h"), cards(["cx-roots", "cx-root1", "cx-z38"], ["cx-roots"]) + `<div class="ex-row">${loadBtn(6, "∛1")}${loadBtn(7, "z³ = 8")}</div>`, g("s10l")) +
      sec(g("s11e"), g("s11h"), cards(["cx-exp", "cx-log"], ["cx-exp", "cx-log"]), g("s11l")) +
      sec(g("s12e"), g("s12h"), uses(ct("g.uses").map(([a, b]) => [LX(a), LX(b)])));
  }
  document.addEventListener("click", e => {
    const b = e.target.closest("[data-cxq]"); if (!b) return;
    const q = QUICK[+b.dataset.cxq]; cx.z = Cx(...q[1]); if (q[2]) cx.w = Cx(...q[2]); cx.op = q[3]; if (q[4]) cx.n = q[4]; renderCX();
    svg3.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "center" });
  });
  function liveCX() {
    const { z, w, n } = cx, set = (id, s) => { const e = $("lv-" + id); if (e) e.innerHTML = s; };
    const zS = binH(z), wS = binH(w), az = cAbs(z), aw = cAbs(w);
    set("cx-tri", `z = ${zS}, w = ${wS}: |z + w| = ${fT(cAbs(cAdd(z, w)))} ≤ ${fT(az)} + ${fT(aw)} = ${fT(az + aw)}`);
    set("cx-modprod", `|zw| = ${fT(cAbs(cMul(z, w)))} = ${fT(az)} · ${fT(aw)}`);
    set("cx-zz", `(${zS})(${binH(Cx(z.re, -z.im))}) = ${fT(az * az)} = |z|²`);
    set("cx-div", aw < 1e-12 ? ct("ui.noDiv") : `z / w = ${binH(cDiv(z, w))}`);
    set("cx-arg", az < 1e-12 ? ct("ui.undefArg") : `Arg(${zS}) ${angOf(cArg(z), "rad").ex ? "=" : "≈"} ${angOf(cArg(z), "rad").s} ≈ ${fmtDeg(cArg(z) * 180 / Math.PI)}°`);
    set("cx-pprod", az * aw < 1e-12 ? "" : `${polH(z, cx.unit)} · ${polH(w, cx.unit)} = ${polH(cMul(z, w), cx.unit)}`);
    set("cx-moivre", `z${sup(n)} = (${zS})${sup(n)} = ${binH(cPow(z, n))}`);
    set("cx-roots", az < 1e-12 ? "" : `${sup(n)}√(${zS}): ${Array.from({ length: n }, (_, kk) => binH(cPol(az ** (1 / n), (cArg(z) + 2 * Math.PI * kk) / n))).join(" · ")}`);
    set("cx-exp", `e^(${zS}) = ${binH(cPol(Math.exp(z.re), z.im))}, |e^z| = e^${fT(z.re)} = ${fT(Math.exp(z.re))}`);
    set("cx-log", az < 1e-12 ? "log 0 ∄" : `Log(${zS}) = ${binH(Cx(Math.log(az), cArg(z)))}`);
  }

  function renderCX(from) {
    const info = drawCX();
    renderPanel(info);
    syncInputs(from);
    $("ops").querySelectorAll("[data-op]").forEach(b => b.setAttribute("aria-pressed", b.dataset.op === cx.op));
    $("nSeg").querySelectorAll("[data-n]").forEach(b => b.setAttribute("aria-pressed", +b.dataset.n === cx.n));
    vis($("wRow"), !!USESW[cx.op]); vis($("nRow"), cx.op === "pow" || cx.op === "root");
    liveCX();
  }
  function applyCX() {
    const only = CXLANG() !== lang;
    $("cxOnly").hidden = !only; $("cxOnly").textContent = nv("cxOnly");
    $("view-cx").lang = cxD() === CX.es ? "es" : "en";
    $("mBin").textContent = ct("ui.bin"); $("mPol").textContent = ct("ui.pol");
    $("cDeg").textContent = t("ui.deg"); $("cRad").textContent = t("ui.radians");
    $("cxEye").textContent = ct("ui.number"); $("cxOpT").textContent = ct("ui.op"); $("cxQuickT").textContent = ct("ui.quick");
    $("cxResT").textContent = ct("ui.result"); $("cxFormsT").textContent = ct("ui.forms");
    $("legend3").innerHTML = [["--c-z", "z"], ["--c-w", "w"], ["--c-r", ct("ui.legR")], ["--c-re", "Re(z) = a"], ["--c-im", "Im(z) = b"]].map(([c, l]) => `<span style="--sw:var(${c})"><i></i>${l}</span>`).join("");
    buildOps(); buildQuick(); labelsCX(); renderGuide3(); renderCX();
  }

  /* ================= popup ================= */
  const dlg = $("demo"), dlgBody = $("demoBody");
  let currentDemo = null;
  function openDemo(id) {
    const F = FORM[id] || CXF[id], Tx = F && F.cx ? (cxD().demos?.[id] ?? CX.es.demos[id]) : t("demos." + id); if (!F || typeof Tx !== "object") return;
    currentDemo = id;
    dlgBody.innerHTML = `<div class="dlg-head"><div><span class="eyebrow">${t("ui.demo")}</span><h2 id="demoTitle">${LX(Tx.t)}</h2></div><button type="button" class="x" aria-label="${t("ui.close")}">×</button></div>
      <div class="stmt">${LX(F.stmt)}</div>${F.fig ? `<div class="figrow">${[].concat(F.fig).map(F.cx ? cxFig : fig).join("")}</div>` : ""}
      <ol class="psteps">${F.f.map((f, i) => `<li><div class="sf">${LX(f)}</div><p>${LX(Tx.s[i] ?? "")}</p></li>`).join("")}</ol>
      <div class="usebox"><b>${t("ui.use")}</b><p>${LX(Tx.u)}</p></div>`;
    dlgBody.querySelector(".x").addEventListener("click", () => dlg.close());
    if (!dlg.open) { dlg.showModal(); dlg.scrollTop = 0; }
  }
  dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });
  dlg.addEventListener("close", () => currentDemo = null);
  document.addEventListener("click", e => { const tg = e.target.closest("[data-demo]"); if (tg && !dlg.contains(tg)) openDemo(tg.dataset.demo); });
  document.addEventListener("keydown", e => {
    if (e.key !== "Enter" && e.key !== " ") return;
    const tg = e.target.closest?.('[data-demo][role="button"]'); if (!tg || tg !== e.target) return;
    e.preventDefault(); openDemo(tg.dataset.demo);
  });

  /* ================= tema ================= */
  const root = document.documentElement, themeBtn = $("themeBtn"), mq = matchMedia("(prefers-color-scheme: dark)");
  const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>';
  const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
  const effective = () => root.getAttribute("data-theme") || (mq.matches ? "dark" : "light");
  function themeIcon() {
    const dark = effective() === "dark";
    themeBtn.innerHTML = dark ? SUN : MOON;
    themeBtn.setAttribute("aria-label", t(dark ? "ui.toLight" : "ui.toDark"));
    themeBtn.title = t(dark ? "ui.toLight" : "ui.toDark");
  }
  try { const saved = localStorage.getItem("trig-theme"); if (saved) root.setAttribute("data-theme", saved); } catch {}
  themeBtn.addEventListener("click", () => {
